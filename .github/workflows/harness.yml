name: Harness verify

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Harness verify (full)
        run: yarn harness:verify --full

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-last-verify
          path: .harness/last-verify.json
          if-no-files-found: ignore
